<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="カウコレ！のサポート・プライバシーポリシー・利用規約">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fffaf5;
      --surface: #ffffff;
      --text: #2b211b;
      --secondary: #6f625b;
      --accent: #e86630;
      --border: #eadfd7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #171310;
        --surface: #211b17;
        --text: #f8eee8;
        --secondary: #c4b7ae;
        --accent: #ff9669;
        --border: #44372f;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.8;
    }
    header {
      padding: 24px 20px;
      color: white;
      background: linear-gradient(135deg, #ef8b3d, #e85c68);
    }
    header a { color: white; text-decoration: none; }
    header strong { font-size: 1.35rem; }
    nav { margin-top: 10px; }
    nav a { margin-right: 18px; font-size: .9rem; }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 32px auto;
      padding: 28px clamp(20px, 5vw, 48px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgb(80 45 25 / 8%);
    }
    h1 { margin-top: 0; font-size: 1.9rem; line-height: 1.4; }
    h2 { margin-top: 2rem; font-size: 1.25rem; }
    h3 { margin-top: 1.5rem; font-size: 1.05rem; }
    a { color: var(--accent); }
    li { margin: .45rem 0; }
    footer {
      padding: 0 20px 32px;
      color: var(--secondary);
      text-align: center;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <strong><a href="{{ '/kaukore/' | relative_url }}">カウコレ！</a></strong>
    <nav>
      <a href="{{ '/kaukore/' | relative_url }}">サポート</a>
      <a href="{{ '/kaukore/privacy.html' | relative_url }}">プライバシーポリシー</a>
      <a href="{{ '/kaukore/terms.html' | relative_url }}">利用規約</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>© 2026 カウコレ！</footer>
</body>
</html>
