<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WIN5ラボのサポート・プライバシーポリシー・利用規約">
  <title>{{ page.title | default: "WIN5ラボ" }}</title>
  <style>
    :root { color-scheme: light dark; --background: #f4f7f5; --surface: #fff; --text: #17201b; --secondary: #637069; --accent: #16834e; --border: #d8e1dc; }
    @media (prefers-color-scheme: dark) { :root { --background: #090c0a; --surface: #121713; --text: #f1f6f3; --secondary: #aab8b0; --accent: #63d796; --border: #29342e; } }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--background); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.8; }
    header { padding: 24px 20px; color: white; background: #10683d; }
    header a { color: white; text-decoration: none; }
    header strong { font-size: 1.35rem; }
    nav { margin-top: 10px; }
    nav a { margin-right: 18px; font-size: .9rem; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto; padding: 28px clamp(20px, 5vw, 48px); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    h1 { margin-top: 0; font-size: 1.9rem; line-height: 1.4; }
    h2 { margin-top: 2rem; font-size: 1.25rem; }
    h3 { margin-top: 1.5rem; font-size: 1.05rem; }
    a { color: var(--accent); }
    li { margin: .45rem 0; }
    footer { padding: 0 20px 32px; color: var(--secondary); text-align: center; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <strong><a href="{{ '/win5-lab/' | relative_url }}">WIN5ラボ</a></strong>
    <nav>
      <a href="{{ '/win5-lab/' | relative_url }}">サポート</a>
      <a href="{{ '/win5-lab/privacy.html' | relative_url }}">プライバシーポリシー</a>
      <a href="{{ '/win5-lab/terms.html' | relative_url }}">利用規約</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>© 2026 WIN5ラボ</footer>
</body>
</html>
